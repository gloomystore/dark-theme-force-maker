<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dark Theme Force Maker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="popup-container">
    <h1>Dark Theme Force Maker</h1>
    <p id="current-domain"></p>

    <div class="popup-btns">
      <button id="btn-normal">Enable Normal Mode</button>
      <button id="btn-ultra">Enable Ultra Mode</button>
    </div>

    <div class="section">
      <label class="toggle-row">
        <input type="checkbox" id="chk-global">
        <span>Apply to all sites</span>
      </label>
      <label class="toggle-row lite-row">
        <input type="checkbox" id="chk-lite">
        <span>Lite mode <span class="lite-hint">(low-power)</span></span>
      </label>
    </div>

    <div class="section">
      <h2>Exclude List</h2>
      <div id="exclude-list"></div>

      <div class="exclude-type-row">
        <label class="type-btn">
          <input type="radio" name="exclude-type" value="wildcard">
          <span>*.domain</span>
        </label>
        <label class="type-btn">
          <input type="radio" name="exclude-type" value="domain" checked>
          <span>domain</span>
        </label>
        <label class="type-btn">
          <input type="radio" name="exclude-type" value="domain-port">
          <span>domain:port</span>
        </label>
      </div>

      <div class="exclude-input-row">
        <input type="text" id="exclude-input" placeholder="e.g. example.com">
        <button id="btn-add-exclude">Add</button>
      </div>
      <button id="btn-exclude-current" class="btn-secondary">Exclude current site</button>
    </div>

    <p id="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
